# Construction et déploiement sur GitHub Pages.
# Aucun secret requis. Dans le dépôt : Settings > Pages > Source : « GitHub Actions ».
# Le déploiement ne se fait qu'après une poussée sur la branche main (ou un déclenchement manuel).
name: Construire et déployer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification de types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Validation du contenu
        run: npm run validate:content
      - name: Validation des traductions
        run: npm run validate:i18n
      - name: Validation de la section Agentic AI
        run: npm run validate:agentic
      - name: Construction (base = nom du dépôt)
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Budget de taille du chargement initial
        run: npm run check:bundle
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  # Tests de bout en bout (Playwright + Chromium) sur un build à base relative.
  # Ils ne conditionnent pas encore le déploiement : ajouter `e2e` à `needs` de `deploy` une fois la suite jugée stable.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Construction
        run: npm run build
      - name: Tests de bout en bout
        run: npm run e2e

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
