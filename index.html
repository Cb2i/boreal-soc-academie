<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Boréal : plateforme d’apprentissage interactive pour Azure, Microsoft Sentinel et KQL, avec données fictives et sans compte." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Boréal : Azure, Sentinel et KQL</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('boreal.progress.v1') || '{}').settings;
        if (t && (t.theme === 'dark' || t.theme === 'light')) document.documentElement.setAttribute('data-theme', t.theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><p style="font-family:sans-serif;padding:2rem">Chargement de Boréal…</p></div>
    <noscript>Boréal nécessite JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
